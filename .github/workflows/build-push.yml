name: Build and push image

# Rebuilds and pushes the image on master (:latest) and release-* branches
# (tagged after the branch, e.g. release-1.0). Can also be run by hand.
#
# Requires repo secrets QUAY_USERNAME and QUAY_TOKEN from a Quay robot account
# with write access to konveyor/rsync-transfer.

on:
  push:
    branches:
      - master
      - release-*
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: quay.io/konveyor/rsync-transfer:${{ steps.tag.outputs.tag }}
